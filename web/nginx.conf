server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;

    # Hashed asset filenames, so they can be cached hard. index.html must not be, or a deploy
    # leaves browsers holding a page that references assets that no longer exist.
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # Same-origin proxy to the API. This is why the frontend needs no CORS configuration: the
    # browser only ever sees one origin, so there is no cross-origin request to permit.
    location /api/ {
        proxy_pass http://api:8080;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        # The API reads the client address from X-Forwarded-For for click analytics.
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # A single-page app: unknown paths are routes, not missing files.
    location / {
        try_files $uri $uri/ /index.html;
        add_header Cache-Control "no-cache";
    }
}
