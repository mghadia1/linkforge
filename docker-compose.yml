services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: linkforge
      POSTGRES_USER: linkforge
      POSTGRES_PASSWORD: linkforge
    # On localhost only: the API reaches it on the Compose network, and
    # tools on this machine at localhost:5432. Not the whole network.
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U linkforge -d linkforge"]
      interval: 5s
      timeout: 3s
      retries: 10

  redis:
    image: redis:7-alpine
    ports:
      - "127.0.0.1:6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  api:
    build: ./api
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    environment:
      DB_URL: jdbc:postgresql://postgres:5432/linkforge
      DB_USER: linkforge
      DB_PASSWORD: linkforge
      REDIS_HOST: redis
      REDIS_PORT: 6379
      LINKFORGE_BASE_URL: http://localhost:8080
      # Set to false to serve every redirect from Postgres; this is the switch the latency
      # benchmark in bench/ flips between its two runs.
      LINKFORGE_CACHE_ENABLED: ${LINKFORGE_CACHE_ENABLED:-true}
      # The benchmark turns click logging off for its isolated arm, so click inserts do not
      # dominate database load in both halves of the comparison.
      LINKFORGE_CLICKS_ENABLED: ${LINKFORGE_CLICKS_ENABLED:-true}
      # Local development only. Left unset the app generates a random key at startup, which is
      # fine but logs everyone out on every restart. A real deployment must supply its own.
      LINKFORGE_JWT_SECRET: ${LINKFORGE_JWT_SECRET:-local-development-signing-key-not-for-deployment}
    ports:
      - "8080:8080"
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:8080/actuator/health | grep -q UP"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s

  web:
    build: ./web
    depends_on:
      api:
        condition: service_healthy
    ports:
      - "3000:80"

volumes:
  postgres-data:
